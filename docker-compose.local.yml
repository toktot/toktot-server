name: toktot-local

services:
  postgres:
    image: postgres:15-alpine
    container_name: toktot-local-db
    environment:
      POSTGRES_DB: toktot_local
      POSTGRES_USER: toktot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${TOKTOT_PG_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktot_user -d toktot_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: toktot-local-redis
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${TOKTOT_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --save 900 1 300 10 60 10000

volumes:
  postgres_data:
  redis_data:
