# 로컬 개발 환경 전용 설정
spring:
  datasource:
    url: jdbc:postgresql://localhost:${TOKTOT_PG_PORT:15432}/toktot_local
    username: toktot_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: ${TOKTOT_REDIS_PORT:16379}

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: https://toktot.site/kakao/callback

# 로깅 설정 (더 자세히)
logging:
  file:
    path: logs
  level:
    com.toktot: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.toktot.external.tourapi: DEBUG

toktot:
  security:
    cors:
      allowed-origins: http://localhost:3000
  frontend:
    url: http://localhost:3000
  s3:
    bucket-name: ${S3_BUCKET_NAME}
    region: ap-northeast-2
  review:
    session:
      ttl-hours: 24
    image:
      max-count: 5
      max-size-mb: 5
      allowed-types: image/jpeg,image/png
  scheduler:
    cron:
      tour-api-base-data: "-"
      tour-api-detail-intro: "-"
      tour-api-detail-common: "-"
      kakao-match: "-"
      seogwipo-good-price: "-"
      jeju-good-price: "-"
      good-price-cache: "-"
      popular-review: "-"

# AWS S3 설정
aws:
  region: ap-northeast-2
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

# TourAPI 설정
tour-api:
  # 기본 API 설정
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_SERVICE_KEY}

  # HTTP 클라이언트 설정
  timeout:
    connection: 5000  # 연결 타임아웃 (5초)
    read: 10000       # 읽기 타임아웃 (10초)

  # API 호출 제한 관리
  rate-limit:
    daily-limit: 1000        # 일일 호출 제한
    warning-threshold: 900   # 경고 임계값 (90%)
    danger-threshold: 950    # 위험 임계값 (95%)

  # 배치 처리 설정
  batch:
    chunk-size: 100         # 청크 단위 처리 크기
    max-retry-count: 3      # 최대 재시도 횟수
    retry-delay-ms: 1000    # 재시도 지연시간 (1초)

management:
  endpoint:
    health:
      show-details: always